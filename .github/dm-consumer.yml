## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. Here: extra apt packages the dist-ai test suites need.
dist-ai-tests:
  ## python3-pam: shim.py imports PAM at module scope, so without it the
  ## shim dies at import and its refusal paths cannot be tested at all.
  ## python3-z3: the argument-count-codec formal-verification core suite
  ## (privleap-tests-verify) hard-FAILs without Z3 (it must not silently
  ## disable itself).
  apt-packages: "python3 python3-pytest python3-hypothesis python3-sdnotify python3-pam python3-z3"
  ## privleap-tests-session-fuzz drives a LIVE privleapd, which the generic
  ## dist-ai lane does not provision -- it has no privleap system group, no PAM
  ## policy, and no shim at the path privleapd hardcodes. That runtime is set up
  ## (and the suite run) per-PR in its own workflow instead:
  ## .github/workflows/session-fuzz.yml.
  skip: [privleap-tests-session-fuzz]
  ## privleap-tests-fuzz-atheris needs the atheris pip package (not packaged
  ## for Debian); coverage-guided fuzzing runs continuously via ClusterFuzzLite.
  allow-skip: [privleap-tests-fuzz-atheris]
