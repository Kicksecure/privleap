## AI-Assisted

## Stateful, concurrent, live-daemon session fuzzer
## (dist-ai privleap-tests-session-fuzz): drives many concurrent
## PrivleapSession conversations against a REAL privleapd to shake out
## thread-safety / message-ordering bugs a single-session parser fuzzer cannot
## reach.
##
## Environment: it re-execs under `sudo unshare --mount` (a private mount
## namespace + tmpfs over /run and /etc/privleap) AND privleap is a Debian
## Trixie package -- privleapd uses 3.13-only APIs and the PAM shim imports the
## `PAM` module Debian's python3-pam provides for the system python. Neither the
## dist-ai CONTAINER lane (no mount namespace) nor a plain ubuntu VM (Python
## 3.12; python3-pam built for it) satisfies both. So it runs in a PRIVILEGED
## debian:trixie container: native Python 3.13, apt deps that match it, and
## SYS_ADMIN for the mount namespace. privleapd + the shim still run from THIS
## checkout, so the fuzzer tests the code under review.
##
## NOT a PR gate: this needs a privileged container and a faithful privleap
## runtime, so it runs on a schedule and on demand rather than blocking PRs.
## The per-PR wire/config/authz fuzzing lives in the Fuzz + dist-ai-fuzz
## workflows.
##
## Reference: dist-ai usr/bin/privleap-tests-session-fuzz

name: Session fuzz

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of fuzz sessions'
        required: false
        default: '4000'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-fuzz:
    name: Live-daemon session fuzz
    ## CI runs only where we enabled it.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
      ## --privileged: the fuzzer needs CAP_SYS_ADMIN to create the mount
      ## namespace + tmpfs the real daemon runs in. The container is ephemeral.
      options: --privileged
    steps:
      - name: Install prerequisites (Trixie, native Python 3.13)
        ## git + node deps for actions/checkout; the privleap runtime deps
        ## (python3-pam gives the shim's `PAM` module, python3-sdnotify the
        ## daemon's), and the suite's own deps -- all matching Trixie's 3.13.
        run: |
          apt-get update
          ## adduser: the minimal image lacks it, but the runtime setup uses
          ## `addgroup` to create the privleap system group.
          apt-get install --yes --no-install-recommends \
            git ca-certificates sudo adduser \
            python3 python3-pam python3-sdnotify \
            python3-hypothesis python3-pytest

      - name: Checkout privleap
        ## https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout dist-ai (test suites + runner)
        ## The suite and its runner live in dist-ai; @master is the org's single
        ## source of truth.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          ref: master
          path: .github/dist-ai
          persist-credentials: false

      - name: Set up privleap runtime (group, PAM policy, shim target)
        ## Centralised in dist-ai so the setup is maintained with the suite; the
        ## daemon + shim still run from THIS checkout (passed as the arg).
        run: ./.github/dist-ai/usr/bin/privleap-tests-session-fuzz-setup "${PWD}"

      - name: Create the unprivileged fuzz caller
        ## session_fuzz REFUSES to run as root: the daemon must attribute
        ## requests to an unprivileged caller (that is the whole authorization
        ## surface). The container is root, so make a normal user with
        ## passwordless sudo (for the mount-namespace re-exec) -- exactly the
        ## VM's runner-user + sudo shape. The workspace stays root-owned but is
        ## world-readable, so the caller can run the checked-out code.
        run: |
          useradd --create-home --shell /bin/bash fuzzcaller
          printf 'fuzzcaller ALL=(ALL) NOPASSWD:ALL\n' \
            > /etc/sudoers.d/fuzzcaller
          chmod 0440 /etc/sudoers.d/fuzzcaller
          chmod -R a+rX "${GITHUB_WORKSPACE}"

      - name: Session fuzz (as the unprivileged caller)
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '4000' }}
        run: |
          sudo -u fuzzcaller \
            env PRIVLEAP_REPO="${GITHUB_WORKSPACE}" ITERATIONS="${ITERATIONS}" \
            bash -c 'cd "${PRIVLEAP_REPO}" \
              && ./.github/dist-ai/usr/bin/privleap-tests-session-fuzz \
                   --iterations "${ITERATIONS}"'
