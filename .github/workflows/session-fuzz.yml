## AI-Assisted

## Stateful, concurrent, live-daemon session fuzzer
## (dist-ai privleap-tests-session-fuzz): drives many concurrent
## PrivleapSession conversations against a REAL privleapd to shake out
## thread-safety / message-ordering bugs a single-session parser fuzzer cannot
## reach.
##
## Environment: privleap is a Debian Trixie package -- privleapd uses 3.13-only
## APIs and the PAM shim does `import PAM` (Debian python3-pam's C module, built
## for Trixie's python). So it runs in a debian:trixie container (native 3.13 +
## matching apt deps). It runs the daemon with PRIVLEAP_TEST_DISPOSABLE_ENV=1,
## which SKIPS the mount namespace + tmpfs -- those exist only to keep a REAL
## host's /run + /etc/privleap untouched, and this container is throwaway. That
## is what lets it run in an ORDINARY, NON-privileged container: `unshare
## --mount` was the only piece needing CAP_SYS_ADMIN. privleapd + the shim still
## run from THIS checkout, so the fuzzer tests the code under review.
##
## All runtime deps + provisioning (runtime setup, the unprivileged caller, the
## fuzz run) live in the dist-ai CI orchestrator so this wrapper stays thin and
## the recipe is maintained with the suite.
##
## Reference: dist-ai usr/bin/privleap-tests-session-fuzz-ci

name: Session fuzz

on:
  pull_request:
    branches: [master]
    paths:
      - 'usr/lib/python3/dist-packages/**/*.py'
      - 'usr/libexec/privleap/**'
      - 'usr/bin/privleapd'
      - 'etc/pam.d/**'
      - '.github/workflows/session-fuzz.yml'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of fuzz sessions'
        required: false
        default: '4000'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-fuzz:
    name: Live-daemon session fuzz
    ## CI runs only where we enabled it; ANDed with the fork-PR guard.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (
        (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository)
        || github.event_name != 'pull_request'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    ## An ORDINARY (non-privileged) container: disposable mode skips the mount
    ## namespace, so no CAP_SYS_ADMIN is needed. Trixie for native 3.13 + the
    ## Debian python3-pam `PAM` module the shim imports.
    container:
      image: debian:trixie
    steps:
      - name: Install checkout prerequisites
        ## Minimal bootstrap so actions/checkout can run in the bare Trixie
        ## image; every runtime dep + all provisioning is owned by the dist-ai
        ## CI orchestrator below, kept with the suite rather than duplicated here.
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates

      - name: Checkout privleap
        ## https://github.com/actions/checkout/releases/tag/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout dist-ai (test suites + CI orchestrator)
        ## The suite, its runner, and the session-fuzz CI orchestrator live in
        ## dist-ai; @master is the org's single source of truth.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          ref: master
          path: .github/dist-ai
          persist-credentials: false

      - name: Provision and run session fuzz
        ## The dist-ai orchestrator installs runtime deps, sets up the privleap
        ## runtime (group / PAM / shim), creates the unprivileged caller
        ## (session_fuzz refuses root), and runs the fuzzer as it in disposable
        ## mode. privleapd + the shim run from THIS checkout (passed as ${PWD}).
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '4000' }}
        run: |
          ./.github/dist-ai/usr/bin/privleap-tests-session-fuzz-ci \
            "${PWD}" --iterations "${ITERATIONS}"
